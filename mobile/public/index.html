<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- OAuth redirect handler for popup/tab auth flow -->
    <script>
      (function() {
        try {
          var search = window.location.search || '';
          var hash = window.location.hash || '';
          var hasCode = search.indexOf('code=') !== -1 || hash.indexOf('code=') !== -1;
          var hasToken = hash.indexOf('access_token=') !== -1 || search.indexOf('access_token=') !== -1;
          var hasIdToken = hash.indexOf('id_token=') !== -1 || search.indexOf('id_token=') !== -1;
          var hasState = search.indexOf('state=') !== -1 || hash.indexOf('state=') !== -1;
          var hasError = search.indexOf('error=') !== -1 || hash.indexOf('error=') !== -1;

          if (hasCode || hasToken || hasIdToken || hasState || hasError) {
            var fullUrl = window.location.href;

            // 1. Inyectar estilo para ocultar inmediatamente el árbol de React (#root)
            var hideStyle = document.createElement('style');
            hideStyle.id = 'skilltrack-oauth-hider';
            hideStyle.innerHTML = '#root { display: none !important; }';
            document.head.appendChild(hideStyle);

            // 2. BroadcastChannel
            try {
              if (typeof BroadcastChannel !== 'undefined') {
                var ch = new BroadcastChannel('skilltrack_oauth_channel');
                ch.postMessage({ url: fullUrl, time: Date.now() });
              }
            } catch(e) {}

            // 3. LocalStorage
            var handle = null;
            try {
              handle = window.localStorage.getItem('ExpoWebBrowserRedirectHandle');
              if (handle) {
                window.localStorage.setItem('ExpoWebBrowser_OriginUrl_' + handle, fullUrl);
              }
              window.localStorage.setItem('SKILLTRACK_OAUTH_RESULT', JSON.stringify({
                url: fullUrl,
                time: Date.now()
              }));
            } catch(e) {}

            // 4. PostMessage
            try {
              var target = window.opener || (window.parent !== window ? window.parent : null);
              if (target) {
                var msg = { url: fullUrl, expoSender: handle || 'ExpoWebBrowserRedirectHandle' };
                target.postMessage(msg, '*');
              }
            } catch(e) {}

            // 5. Renderizar mensaje de éxito en caso de que el navegador retrase el cierre
            document.addEventListener('DOMContentLoaded', function() {
              try {
                var rootEl = document.getElementById('root');
                if (rootEl) rootEl.remove();
                document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0b0f19;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px;"><div style="font-size:48px;margin-bottom:12px;">✅</div><h2 style="font-size:20px;margin-bottom:8px;font-weight:600;">¡Autenticación completada!</h2><p style="color:#94a3b8;font-size:14px;margin-bottom:20px;">Ya podés volver a la ventana principal de SkillTrack.</p><button onclick="window.close()" style="background:#4f46e5;color:#fff;border:none;padding:10px 22px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;">Cerrar ventana</button></div>';
              } catch(e) {}
            });

            // 6. Intentar cerrar inmediatamente la ventana emergente
            try { window.close(); } catch(e) {}
            setTimeout(function() { try { window.close(); } catch(e) {} }, 150);
            setTimeout(function() { try { window.close(); } catch(e) {} }, 600);
          }
        } catch (err) {
          console.error('SkillTrack OAuth redirect handler error:', err);
        }
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
