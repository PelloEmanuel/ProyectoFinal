# ============================================================================
# Archivo: render.yaml
# Descripción: Configuración automática (Blueprint) para desplegar en Render
# tanto la base de datos PostgreSQL como el servicio web de Node.js/Express.
# ============================================================================
databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow_user
    plan: free

services:
  - type: web
    name: taskflow-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_INIT_DB
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: REFRESH_DAYS
        value: "30"
